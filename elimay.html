<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sunsun Solar - Login</title>

    <!-- Connect HTML to CSS -->
    <link rel="stylesheet" href="eli.css">
</head>

<body>

    <!-- =========================
         BACKGROUND SUN
    ========================== -->

    <div class="sun"></div>


    <!-- =========================
         CLOUDS
    ========================== -->

    <div class="cloud cloud-left"></div>
    <div class="cloud cloud-right"></div>


    <!-- =========================
         BIRDS
    ========================== -->

    <div class="bird bird1"></div>
    <div class="bird bird2"></div>


    <!-- =========================
         BOTTOM HILLS
    ========================== -->

    <div class="hill hill-back"></div>
    <div class="hill hill-middle"></div>
    <div class="hill hill-front"></div>


    <!-- =========================
         LOGIN CARD
    ========================== -->

    <div class="login-card">

        <!-- Sunsun Solar Logo -->
        <div class="logo-sun">
            <span>
                Sunsun<br>
                Solar
            </span>
        </div>


        <!-- Login Title -->
        <h1>Login</h1>


        <!-- Username -->
        <div class="input-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
            >

        </div>


        <!-- Password -->
        <div class="input-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

        </div>


        <!-- Forgot Password -->
        <div class="forgot">

            <a href="#">
                Forgot Password?
            </a>

        </div>


        <!-- Login Button -->
        <button type="button">
            Login
        </button>

    </div>

</body>

</html>
